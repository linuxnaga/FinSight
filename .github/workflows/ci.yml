name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        # Agent tests need the downloaded corpus (make data) and are skipped here.
        run: pytest -q
      - name: Gold set is well-formed
        run: |
          python - <<'EOF'
          import json
          rows = [json.loads(l) for l in open("eval/gold.jsonl")]
          assert 60 <= len(rows) <= 100, len(rows)
          ids = [r["id"] for r in rows]
          assert len(ids) == len(set(ids)), "duplicate ids"
          for r in rows:
              assert r["question"] and r["type"], r["id"]
              assert r["should_refuse"] or r["gold_answer"], r["id"]
          print(f"gold.jsonl ok: {len(rows)} items")
          EOF
