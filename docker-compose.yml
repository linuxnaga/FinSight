services:
  api:
    build: .
    env_file: .env
    environment:
      FINSIGHT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    volumes:
      - ./eval/results:/app/eval/results:ro
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
